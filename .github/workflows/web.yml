name: Web (Next.js)

on:
  push:
    branches: ["main"]
    paths: ["web/**", "content/cards/**", ".github/workflows/web.yml"]
  pull_request:
    branches: ["main"]
    paths: ["web/**", "content/cards/**", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Katalog bundled sinkron dengan content/cards
        run: npm run catalog:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (engine golden vs Dart, bot, backend lokal, UI logic)
        run: npm test

      - name: Build (static export)
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dokimon-web
          path: web/out
          retention-days: 7
