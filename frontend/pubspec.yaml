name: dokimon
description: Dokimon TCG 3D — turn-based card game vs bot.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^8.1.6
  dio: ^5.7.0
  go_router: ^14.2.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  model_viewer_plus: ^1.7.2
  intl: ^0.20.3
  uuid: ^4.5.1
  crypto: ^3.0.5
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# path_provider_android 2.3.x memakai plugin `jni` yang butuh NDK/CMake.
# Untuk build APK di mesin tanpa NDK lengkap, pakai implementasi Java 2.2.x.
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
  assets:
    - assets/cards/cards.seed.json
